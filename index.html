<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向贝类育苗流程的实时水质监测、异常预警、投放后跟踪与育苗池数据管理演示系统" />
    <meta name="theme-color" content="#010812" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (function () {
        var query = new URLSearchParams(location.search);
        var debug = "%MODE%" === "development" && ["splashTest", "splashAt", "splashPhase"].some(function (key) { return query.has(key); });
        window.__SPLASH_STATE__ = { debug: debug, seen: false };
      })();
    </script>
    <link rel="stylesheet" href="./src/splash.css" />
    <title>贝类育苗水质监测平台</title>
  </head>
  <body>
    <div id="splash" data-mode="%MODE%" role="status" aria-live="polite" aria-label="正在进入贝类育苗水质监测平台">
      <div class="sc-scene">
        <img class="sc-sky" src="./images/splash/sky.webp" alt="" aria-hidden="true" />
        <div class="sc-moon-glow" aria-hidden="true"></div>
        <div class="sc-moon" aria-hidden="true">
          <img src="./images/splash/moon-v2.webp" alt="" />
          <div class="sc-data-tint"></div>
          <svg class="sc-network" viewBox="0 0 100 100"></svg>
        </div>
        <img class="sc-sea-base" src="./images/splash/sea.webp" alt="" aria-hidden="true" />
        <canvas class="sc-water" aria-hidden="true"></canvas>
        <div class="sc-orbits" aria-hidden="true"><i></i><i></i></div>
        <div class="sc-metrics" aria-hidden="true">
          <div class="sc-node" style="--x:0;--y:-.39"><div class="sc-node-content"><svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 1 6 0v9.3a5 5 0 1 1-6 0Z"/><path d="M12 5v10"/></svg><strong>水温</strong><span>°C</span></div></div>
          <div class="sc-node" style="--x:-.34;--y:-.19"><div class="sc-node-content"><svg viewBox="0 0 24 24"><path d="M5 12h14M8 8v8M16 8v8"/></svg><strong>pH</strong><span>pH</span></div></div>
          <div class="sc-node" style="--x:.34;--y:-.19"><div class="sc-node-content"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M7 16c2-5 8-5 10 0M8 7h8"/></svg><strong>溶解氧</strong><span>mg/L</span></div></div>
          <div class="sc-node" style="--x:-.34;--y:.2"><div class="sc-node-content"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="1"/><circle cx="13" cy="6" r="1"/><circle cx="17" cy="10" r="1"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="16" r="1"/><circle cx="6" cy="18" r="1"/></svg><strong>浊度</strong><span>NTU</span></div></div>
          <div class="sc-node" style="--x:.34;--y:.2"><div class="sc-node-content"><svg viewBox="0 0 24 24"><path d="M3 8c3-3 5 3 9 0s6 3 9 0M3 13c3-3 5 3 9 0s6 3 9 0M3 18c3-3 5 3 9 0s6 3 9 0"/></svg><strong>盐度</strong><span>PSU</span></div></div>
          <div class="sc-node" style="--x:0;--y:.39"><div class="sc-node-content"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19h14L14 9V3M8 15h8"/></svg><strong>氨氮</strong><span>mg/L</span></div></div>
        </div>
        <div class="sc-road" aria-hidden="true"></div>
        <div class="sc-wave sc-wave-left" aria-hidden="true"><img src="./images/splash/wave-left-v2.webp" alt="" /></div>
        <div class="sc-wave sc-wave-right" aria-hidden="true"><img src="./images/splash/wave-left-v2.webp" alt="" /></div>
        <div class="sc-copy"><h1>海上生明月</h1><p>以数据守护每一片海</p><small>CLEAN OCEAN · BRIGHTER TOMORROW</small></div>
        <div class="sc-loader" role="status">正在准备页面…</div>
        <div class="sc-footer"><span>让每一滴水，都更清澈</span><span>探索 · 监测 · 守护</span><span>数据 · 让海洋更可持续</span><span>汇聚六项指标 · 守护蔚蓝之海</span><span>通向更清澈的未来</span></div>
      </div>
      <button type="button" class="sc-skip" aria-label="跳过启动动画">跳过</button>
    </div>
    <noscript><style>#splash{display:none}</style></noscript>
    <div id="root"></div>
    <script type="module" src="./src/startup.js"></script>
  </body>
</html>
